name = "nyx-image-gen"
main = ".open-next/worker.js"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

[vars]
# Runtime env vars — set secrets via CF dashboard or wrangler secret put
# GROQ_API_KEY = set in CF dashboard
# NYX_WORKER_URL = set in CF dashboard

[[rules]]
type = "ESModule"
globs = ["**/*.js"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
